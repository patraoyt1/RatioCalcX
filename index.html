<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatioCalcX</title>

<meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js para Reatividade e Cálculos -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        
        /* Oculta as setinhas dos inputs de número nativos */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>

    <script>
        function app() {
            return {
                // Catálogo de proporções atualizado com o S24 Ultra
                ratios: {
                    '16:9': { w: 16, h: 9, defW: 1920, defH: 1080, label: 'Widescreen (Vídeos)' },
                    '9:16': { w: 9, h: 16, defW: 1080, defH: 1920, label: 'Vertical (Shorts)' },
                    '19.5:9': { w: 19.5, h: 9, defW: 3120, defH: 1440, label: 'Celular S24 (Paisagem)' },
                    '9:19.5': { w: 9, h: 19.5, defW: 1440, defH: 3120, label: 'Celular S24 (Retrato)' },
                    '1:1':  { w: 1, h: 1, defW: 1080, defH: 1080, label: 'Quadrado (Feed)' },
                    '4:3':  { w: 4, h: 3, defW: 1440, defH: 1080, label: 'Standard / Clássico' },
                    '3:4':  { w: 3, h: 4, defW: 1080, defH: 1440, label: 'Retrato (Fotos)' },
                    '21:9': { w: 21, h: 9, defW: 2560, defH: 1080, label: 'Ultrawide (Cinema)' },
                    '3:2':  { w: 3, h: 2, defW: 1080, defH: 720, label: 'Fotografia' }
                },
                activeRatio: '16:9',
                width: 1920,
                height: 1080,
                
                // Atualiza a proporção e define a resolução padrão
                setRatio(ratioKey) {
                    this.activeRatio = ratioKey;
                    this.width = this.ratios[ratioKey].defW;
                    this.height = this.ratios[ratioKey].defH;
                },
                
                // Calcula a Altura baseada na Largura
                calcHeight() {
                    if(!this.width) return;
                    let r = this.ratios[this.activeRatio];
                    this.height = Math.round(this.width / (r.w / r.h));
                },
                
                // Calcula a Largura baseada na Altura
                calcWidth() {
                    if(!this.height) return;
                    let r = this.ratios[this.activeRatio];
                    this.width = Math.round(this.height * (r.w / r.h));
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container principal (ajustado max-w-4xl para caber melhor os novos botões) -->
    <div x-data="app()" x-cloak class="w-full max-w-4xl bg-gray-900 border border-blue-900/50 rounded-2xl shadow-2xl p-6 md:p-8 space-y-8">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black text-white tracking-tighter flex items-center justify-center gap-3">
                <i class="fa-solid fa-crop-simple text-blue-500"></i> Ratio<span class="text-blue-500">CalcX</span>
            </h1>
            <p class="text-gray-400 text-sm">Selecione uma proporção e defina os pixels com precisão.</p>
        </div>

        <!-- Botões de Proporção (Grid dinâmico ajustado) -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <template x-for="(data, key) in ratios" :key="key">
                <button @click="setRatio(key)" 
                        class="p-3 rounded-xl border transition-all duration-300 flex flex-col items-center justify-center gap-1 shadow-sm"
                        :class="activeRatio === key ? 'bg-blue-600/20 border-blue-500 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'bg-gray-800 border-gray-700 text-gray-400 hover:border-gray-500 hover:text-white'">
                    <span class="font-black text-lg" x-text="key"></span>
                    <span class="text-[10px] uppercase tracking-wider text-center" x-text="data.label"></span>
                </button>
            </template>
        </div>

        <!-- Inputs de Resolução -->
        <div class="flex flex-col md:flex-row gap-6 items-center bg-gray-800/50 p-6 rounded-xl border border-gray-700/50">
            
            <div class="flex-1 w-full space-y-2">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Largura (Width)</label>
                <div class="relative">
                    <input type="number" x-model="width" @input="calcHeight()" 
                           class="w-full bg-gray-900 border border-gray-700 text-white text-2xl font-mono px-4 py-3 rounded-lg outline-none focus:border-blue-500 transition-colors shadow-inner">
                    <span class="absolute right-4 top-4 text-gray-500 font-bold">px</span>
                </div>
            </div>

            <div class="text-gray-600">
                <i class="fa-solid fa-link text-xl" :class="width && height ? 'text-blue-500' : ''"></i>
            </div>

            <div class="flex-1 w-full space-y-2">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Altura (Height)</label>
                <div class="relative">
                    <input type="number" x-model="height" @input="calcWidth()" 
                           class="w-full bg-gray-900 border border-gray-700 text-white text-2xl font-mono px-4 py-3 rounded-lg outline-none focus:border-blue-500 transition-colors shadow-inner">
                    <span class="absolute right-4 top-4 text-gray-500 font-bold">px</span>
                </div>
            </div>

        </div>

        <!-- Visualizador Dinâmico e Integração de API -->
        <div class="pt-4 border-t border-gray-800">
            <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-widest text-center">Visualização da Área e API</h3>
            
            <div class="flex flex-col items-center justify-center gap-4">
                <div class="bg-blue-600/20 border-2 border-blue-500 border-dashed rounded-lg flex items-center justify-center transition-all duration-500 max-w-full"
                     :style="`aspect-ratio: ${ratios[activeRatio].w} / ${ratios[activeRatio].h}; max-height: 250px;`">
                     <span class="text-blue-400 font-mono font-bold text-sm px-4 text-center">
                         <span x-text="width"></span> x <span x-text="height"></span>
                     </span>
                </div>
                
                <!-- Recomendação da API Integrada (Placehold.co) -->
                <p class="text-[11px] text-gray-500 text-center max-w-md">
                    <i class="fa-solid fa-code text-blue-400 mr-1"></i> Precisa de uma imagem de teste dessa exata resolução? Use a URL da API abaixo:
                    <br>
                    <code class="bg-gray-900 text-green-400 px-2 py-1 rounded border border-gray-800 mt-2 block" 
                          x-text="`https://placehold.co/${width}x${height}`"></code>
                </p>
            </div>
        </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.error('Erro ao registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
